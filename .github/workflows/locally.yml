# Deploys this example to Locally the same way its README does, then tears it
# down again - so a change that stops the example deploying fails its PR.
name: Locally

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: locally-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Locally
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: Locally signs in using GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The containerd image store in the runner's Docker version ignores
      # /etc/docker/certs.d when fetching a registry's OAuth token, so the push
      # fails with "x509: certificate signed by unknown authority" even though
      # the CA is trusted for the registry itself (moby/moby c2075797). The
      # classic image store uses the registry's TLS settings for both, so
      # switch to it. This restarts Docker, so it has to happen before Locally
      # starts any containers. Remove once the runner image ships Docker
      # 29.9.0 or later: https://github.com/actions/runner-images/issues/15330
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          jq '.features["containerd-snapshotter"] = false' <<<"$current" | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker version --format 'Docker {{.Server.Version}}'
          docker info --format 'Storage driver: {{.Driver}}'

      # The runner has both Docker and Podman, and Locally may pick Podman to
      # run the apps - but the images are pushed with Docker, and only Docker
      # is told to trust Locally's CA for the registry, so Podman's pulls fail
      # with "tls: bad certificate" and the slots never start. Read by
      # `locally ci` when it starts, so this has to come before setup-locally.
      - name: Run the apps under Docker
        run: echo "LOCALLY_CONTAINER_RUNTIME=docker" >> "$GITHUB_ENV"

      - uses: locallybuild/setup-locally@dc4fb46b46af5deded2a7e8ce1b6da7c337240f0 # v1.2.0
        with:
          team-uuid: ${{ vars.LOCALLY_TEAM_UUID }}
          plugins: custom
          plugins-list: |
            Microsoft.ContainerRegistry
            Microsoft.Insights
            Microsoft.OperationalInsights
            Microsoft.Web

      - name: Apply environments/locally
        id: apply0
        working-directory: environments/locally
        run: |
          set -euo pipefail
          terraform init -input=false

          # The runner's trust store doesn't hold the CA setup-locally
          # generated, so Docker is told to trust it for the registry before
          # the images are pushed. The registry's name isn't known until it
          # exists, so it's created first, on its own.
          locally run terraform apply -auto-approve -input=false \
            -target=module.app-service-deployment-slots.azurerm_container_registry.main
          registry="$(locally run az acr list --query '[0].loginServer' --output tsv)"
          sudo mkdir -p "/etc/docker/certs.d/$registry"
          sudo cp "$LOCALLY_TLS_CA_FILE_PATH" "/etc/docker/certs.d/$registry/ca.crt"

          locally run terraform apply -auto-approve -input=false

      # Production should be running v1 (blue) and staging v2 (green), each
      # with its own slot setting - as the README describes before a swap.
      - name: Check each slot serves its release
        working-directory: environments/locally
        run: |
          set -euo pipefail

          check() {
            local url="$1" version="$2" slot="$3" info="" err=""
            # The containers can take a little while to come up once deployed.
            for _ in $(seq 60); do
              if info="$(curl --silent --show-error --fail --cacert "$LOCALLY_TLS_CA_FILE_PATH" \
                  "$url/api/info" 2>/tmp/curl.err)"; then
                err=""
                break
              fi
              err="$(cat /tmp/curl.err)"
              sleep 5
            done
            echo "$url/api/info: ${info:-<no response>}"
            if [ -n "$err" ]; then
              echo "::error::$url/api/info never responded: $err"
              return 1
            fi
            jq -e --arg version "$version" --arg slot "$slot" \
              '.release.version == $version and .settings.SLOT_ENVIRONMENT == $slot' <<<"$info" >/dev/null ||
              { echo "::error::expected $url to serve $version in $slot"; return 1; }
          }

          # Check both, so a failure shows whether one slot or both are affected.
          status=0
          check "$(terraform output -raw production_url)" v1 production || status=1
          check "$(terraform output -raw staging_url)" v2 staging || status=1
          exit "$status"

      - name: Show why the deployment failed
        if: failure() && steps.apply0.outcome == 'failure'
        run: |
          locally logs --json |
            jq -r '.[] | select(.uri | test("/api/deployments/")) | .responseBody // empty | fromjson? | .status_text // empty' |
            sort -u

      # Any failed requests Locally saw for the web app and its slot, such as
      # an image pull it couldn't make.
      - name: Show failed App Service requests
        if: failure()
        run: |
          locally logs --json |
            jq -r '.[] | select((.statusCode // .status // .responseStatus // 0 | tonumber? // 0) >= 400 and (.uri | test("Microsoft.Web|/v2/"; "i")))
              | "\(.statusCode // .status // .responseStatus) \(.method // "") \(.uri)\n\(.responseBody // "" | tostring | .[0:500])"' || true

      # The apps' own output doesn't make it into Locally's CI log, so print the
      # logs of the containers Locally started when something fails. Locally
      # may run them under Docker or Podman, so both are listed. Workflow
      # commands are turned off while the logs print, so nothing in them is
      # acted on, and these all belong to this job's throwaway Locally instance.
      - name: Show container logs
        if: failure()
        run: |
          stop="$(uuidgen)"
          for runtime in docker podman; do
            command -v "$runtime" >/dev/null || continue
            echo "::group::$runtime ps -a"
            "$runtime" ps -a || true
            echo "::endgroup::"
            "$runtime" ps -a --format '{{.Names}}' 2>/dev/null | grep -E '^(furnace|locally)-' | while read -r name; do
              echo "::group::$runtime logs $name"
              echo "::stop-commands::$stop"
              "$runtime" logs --tail 300 "$name" 2>&1 || true
              echo "::$stop::"
              echo "::endgroup::"
            done
          done

      - name: Destroy environments/locally
        # Only once there's something to destroy.
        if: always() && steps.apply0.outcome != 'skipped'
        working-directory: environments/locally
        run: locally run terraform destroy -auto-approve -input=false

      - uses: locallybuild/setup-locally/teardown@dc4fb46b46af5deded2a7e8ce1b6da7c337240f0 # v1.2.0
        if: always()
